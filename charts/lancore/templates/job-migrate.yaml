{{- $extraEnv := list
  (dict "name" "FLAVOR" "value" "octane")
  (dict "name" "TICKET_TOKEN_PEPPER" "valueFrom" (dict "secretKeyRef" (dict
    "name" .Values.ticketing.tokenPepperSecret.name
    "key"  .Values.ticketing.tokenPepperSecret.key
  )))
  (dict "name" "DB_PASSWORD" "valueFrom" (dict "secretKeyRef" (dict
    "name" .Values.database.existing.passwordSecret.name
    "key"  .Values.database.existing.passwordSecret.key
  )))
-}}
{{- include "lan-common.jobMigrate" (dict "context" . "extraEnv" $extraEnv) }}
