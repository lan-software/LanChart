{{- if and .Values.appSecrets.enabled (eq .Values.appSecrets.provider "chart") -}}
{{- /*
  Synthesises the per-release app Secret. APP_KEY is stabilised across upgrades
  via the `lookup` function so `helm upgrade` does not rotate it (which would
  invalidate all encrypted payloads). On a first install, a random key is
  generated; on subsequent upgrades, the existing Secret's APP_KEY is re-used.

  Secret values that come from upstream Secrets (DB password, S3 credentials,
  mail credentials, Stripe, WebPush, TMT2) are NOT duplicated here — they live
  in their own Secrets referenced by name in the ConfigMap and values blocks.
  This Secret holds only app-level secrets owned by the chart: APP_KEY,
  TICKET_TOKEN_PEPPER, and optional Horizon/Pulse auth strings.
*/ -}}
{{- $secretName := include "lancore.appSecretName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $appKey := "" -}}
{{- if and $existing $existing.data (index $existing.data "APP_KEY") -}}
{{- $appKey = index $existing.data "APP_KEY" | b64dec -}}
{{- else -}}
{{- $appKey = printf "base64:%s" (randAlphaNum 32 | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lan-common.labels" (dict "context" .) | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ $appKey | quote }}
{{- end -}}
