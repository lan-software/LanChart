{{- if .Values.ticketing.signingKeys.inlineKeys -}}
{{- /*
  Dev-only: render the Ed25519 ticket-signing keyring into a Kubernetes Secret
  from a values map. Production deployments provide this Secret out-of-band
  (kubectl create secret generic, or via an ExternalSecret) — NEVER via values.
  See SSDD §5.6 + SSS ENV-DEP-020.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lancore.signingKeysSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lan-common.labels" (dict "context" .) | nindent 4 }}
  annotations:
    lan-software.mawiguko.dev/dev-inline-keys: "true"
type: Opaque
data:
  {{- range $kid, $keyB64 := .Values.ticketing.signingKeys.inlineKeys }}
  {{ $kid }}.key: {{ $keyB64 | quote }}
  {{- end }}
{{- end -}}
