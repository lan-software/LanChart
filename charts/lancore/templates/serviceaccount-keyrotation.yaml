{{- if .Values.ticketing.signingKeys.rotation.enabled -}}
{{- $saName := printf "%s-keys-rotation" (include "lan-common.fullname" .) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lan-common.labels" (dict "context" . "component" "keys-rotation") | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lan-common.labels" (dict "context" . "component" "keys-rotation") | nindent 4 }}
rules:
  # Patch only the one signing-keys Secret.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ include "lancore.signingKeysSecretName" . | quote }}]
    verbs: ["get", "patch", "update"]
  # Patch the web + worker Deployments to bump the rotation annotation.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - {{ include "lan-common.componentName" (dict "context" . "component" "web") | quote }}
      - {{ include "lan-common.componentName" (dict "context" . "component" "worker") | quote }}
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $saName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lan-common.labels" (dict "context" . "component" "keys-rotation") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $saName }}
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
