{{- $monitoring := (.Values.global | default dict).monitoring | default dict -}}
{{- if and .Values.prometheusRule.enabled $monitoring.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "lan-common.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lan-common.labels" (dict "context" .) | nindent 4 }}
    {{- with $monitoring.ruleLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    {{- if .Values.prometheusRule.overrideGroups }}
    {{- toYaml .Values.prometheusRule.overrideGroups | nindent 4 }}
    {{- else }}
    - name: lanentrance.availability
      rules:
        - alert: LanentranceHTTP5xxRateHigh
          expr: |
            sum(rate(nginx_ingress_controller_requests{exported_namespace="{{ .Release.Namespace }}",exported_service=~"{{ include "lan-common.fullname" . }}.*",status=~"5.."}[5m]))
            /
            sum(rate(nginx_ingress_controller_requests{exported_namespace="{{ .Release.Namespace }}",exported_service=~"{{ include "lan-common.fullname" . }}.*"}[5m]))
            > 0.02
          for: 5m
          labels: { severity: warning, app: lanentrance }
          annotations: { summary: "LanEntrance 5xx rate > 2% for 5m" }
    - name: lanentrance.jwks
      rules:
        - alert: LanentranceJWKSFetchFailures
          expr: sum(rate(lancore_client_jwks_fetch_failures_total{namespace="{{ .Release.Namespace }}",app="lanentrance"}[15m])) > 0
          for: 15m
          labels: { severity: critical, app: lanentrance }
          annotations:
            summary: "LanEntrance cannot refresh JWKS from LanCore"
            description: "JWKS refreshes have failed for 15 minutes; ticket validation will start returning errors once the cached keys expire."
    {{- end }}
{{- end -}}
