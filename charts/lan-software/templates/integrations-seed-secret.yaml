{{- /*
  Shared integrations-seed Secret.

  One Secret holding, per enabled satellite, a bearer token plus two
  webhook secrets (announcement + roles). Values come from:
    1. operator override: .Values.global.integrations.<slug>.token /
       .announcementWebhookSecret / .rolesWebhookSecret
    2. the existing Secret (via helm `lookup`) — stable across upgrades,
       so routine `helm upgrade` does NOT rotate tokens.
    3. a fresh `randAlphaNum 48` on first install.

  The Secret is read by LanCore (the reconciler's `integrations:sync`
  command populates `config/integrations.php` from these env vars) AND by
  each satellite sub-chart (as its `LANCORE_TOKEN` + `LANCORE_WEBHOOK_SECRET`).

  Key shape: <SLUG>_LANCORE_TOKEN, <SLUG>_ANNOUNCEMENT_WEBHOOK_SECRET,
  <SLUG>_ROLES_WEBHOOK_SECRET. The SLUG is uppercased and `-` → `_`
  substituted so keys are valid env-var names.

  @see docs/adr/0008-declarative-integration-config.md
  @see docs/mil-std-498/SSDD.md §5.4.5  (LanCore)
*/}}
{{- $integ := (.Values.global.integrations | default dict) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "lan-common.integrationsSeedSecretName" .) -}}
{{- $slugs := list "lanbrackets" "lanentrance" "lanshout" "lanhelp" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "lan-common.integrationsSeedSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: lan-software
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: lan-software
    helm.sh/chart: {{ printf "%s-%s" .Chart.Name .Chart.Version | replace "+" "_" | trunc 63 | trimSuffix "-" }}
    lan-software.mawiguko.dev/managed-by: umbrella-seed
type: Opaque
stringData:
  {{- range $slug := $slugs }}
  {{- $override := get $integ $slug | default dict -}}
  {{- $upper := $slug | upper | replace "-" "_" -}}
  {{- $tokenKey := printf "%s_LANCORE_TOKEN" $upper -}}
  {{- $annKey   := printf "%s_ANNOUNCEMENT_WEBHOOK_SECRET" $upper -}}
  {{- $roleKey  := printf "%s_ROLES_WEBHOOK_SECRET" $upper -}}
  {{- /* Token */ -}}
  {{- $token := $override.token -}}
  {{- if (not $token) -}}
    {{- if (and $existing $existing.data (index $existing.data $tokenKey)) -}}
      {{- $token = index $existing.data $tokenKey | b64dec -}}
    {{- else -}}
      {{- $token = printf "lci_%s" (randAlphaNum 48) -}}
    {{- end -}}
  {{- end -}}
  {{- /* Announcement webhook secret */ -}}
  {{- $ann := $override.announcementWebhookSecret -}}
  {{- if (not $ann) -}}
    {{- if (and $existing $existing.data (index $existing.data $annKey)) -}}
      {{- $ann = index $existing.data $annKey | b64dec -}}
    {{- else -}}
      {{- $ann = randAlphaNum 64 -}}
    {{- end -}}
  {{- end -}}
  {{- /* Roles webhook secret */ -}}
  {{- $roles := $override.rolesWebhookSecret -}}
  {{- if (not $roles) -}}
    {{- if (and $existing $existing.data (index $existing.data $roleKey)) -}}
      {{- $roles = index $existing.data $roleKey | b64dec -}}
    {{- else -}}
      {{- $roles = randAlphaNum 64 -}}
    {{- end -}}
  {{- end }}
  {{ $tokenKey }}: {{ $token | quote }}
  {{ $annKey }}: {{ $ann | quote }}
  {{ $roleKey }}: {{ $roles | quote }}
  {{- end }}
