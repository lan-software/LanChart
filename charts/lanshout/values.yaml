nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/lan-software/lanshout
  tag: ""
  pullPolicy: IfNotPresent
  port: 80

imagePullSecrets: []

web:
  enabled: true
  replicaCount: 2
  roleEnv: all
  skipMigrate: "1"
  terminationGracePeriodSeconds: 30
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }
  hpa: { enabled: false }
  pdb:
    enabled: true
    minAvailable: 1

worker: { enabled: false }
migrations: { enabled: true }

service: { type: ClusterIP, annotations: {}, metricsPort: 9090 }

ingress:
  enabled: true
  className: nginx
  # Hosts computed via lan-common.satelliteHost from global.domain + style.
  hosts: []
  # TLS termination is selected globally via global.tls.mode
  # (acme | preprovisioned | passthrough).
  tls:
    secretName: ""
  annotations: {}

lancore:
  appSlug: lanshout
  satellite:
    enabled: true
    baseUrl: ""
    internalUrl: ""
    callbackUrl: ""
    tokenSecret:   { name: "", key: token }
    webhookSecret: { name: "", key: webhook_secret }

# LanShout-specific
defaultLocale: de

database:
  driver: pgsql
  # Consumer-side connection config only; the Postgres cluster is owned
  # by the umbrella (global.database).
  existing:
    host: ""
    port: 5432
    database: lanshout
    username: lanshout
    passwordSecret: { name: "", key: password }

cache:
  driver: dragonfly
  createInstance: false
  instance:
    name: lanshout-dragonfly
    replicas: 1
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { memory: 256Mi }
    persistence: { enabled: false, storageClass: "", size: 1Gi }
  existing:
    host: ""
    port: 6379
    passwordSecret: { name: lanshout-cache, key: password }
  databases: { cache: 1, sessions: 2 }

mail:
  driver: log
  host: ""
  port: 587
  encryption: tls
  credentialsSecret: { name: lanshout-smtp }
  from: { address: noreply@example.com, name: LanShout }

configMap:  { enabled: true }
appSecrets: { enabled: true, provider: chart }

serviceAccount: { create: true, name: "", annotations: {}, automountToken: false }

podSecurityContext: {}
containerSecurityContext: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

networkPolicy:
  enabled: true
  allowFrom: [ingress-nginx, prometheus, otel-collector]
  allowToEgress: [dns, postgres, cache, lancore-internal]
  ingress: []
  egress: []

serviceMonitor: { enabled: false, interval: 30s, scrapeTimeout: 10s, path: /metrics }
prometheusRule: { enabled: false }

global: {}
