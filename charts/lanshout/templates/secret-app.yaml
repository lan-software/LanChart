{{- if and .Values.appSecrets.enabled (eq .Values.appSecrets.provider "chart") -}}
{{- $secretName := printf "%s-app" (include "lan-common.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $appKey := "" -}}
{{- if and $existing $existing.data (index $existing.data "APP_KEY") -}}
{{- $appKey = index $existing.data "APP_KEY" | b64dec -}}
{{- else -}}
{{- $appKey = printf "base64:%s" (randAlphaNum 32 | b64enc) -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lan-common.labels" (dict "context" .) | nindent 4 }}
type: Opaque
stringData:
  APP_KEY: {{ $appKey | quote }}
{{- end -}}
