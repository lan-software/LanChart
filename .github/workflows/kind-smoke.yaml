name: kind-smoke

on:
  pull_request:
    branches: [main]
    types: [labeled, opened, synchronize]
  schedule:
    - cron: "0 6 * * *"   # nightly
  workflow_dispatch:

permissions:
  contents: read

env:
  HELM_VERSION: v3.16.3
  KIND_VERSION: v0.24.0
  KIND_NODE_IMAGE: kindest/node:v1.31.0
  K8S_VERSION: "1.31.0"

jobs:
  smoke:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'kind-smoke')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kind
        run: |
          curl -Lo /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/${{ env.KIND_VERSION }}/kind-linux-amd64"
          chmod +x /usr/local/bin/kind
          kind version

      - name: Create kind cluster
        run: |
          kind create cluster --name lan-software-smoke --image ${{ env.KIND_NODE_IMAGE }} --wait 5m
          kubectl cluster-info

      - name: Install prereq operators
        run: |
          helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
          helm repo add postgres-operator-charts https://opensource.zalando.com/postgres-operator/charts/postgres-operator/
          helm repo update

          kubectl create namespace ingress-nginx
          helm install ingress-nginx ingress-nginx/ingress-nginx -n ingress-nginx --wait --timeout 5m

          # examples/values-dev-kind.yaml uses global.tls.mode: passthrough,
          # so cert-manager is not needed for the smoke job.

          kubectl create namespace postgres-operator
          helm install postgres-operator postgres-operator-charts/postgres-operator -n postgres-operator --wait --timeout 5m

          kubectl apply -f https://raw.githubusercontent.com/dragonflydb/dragonfly-operator/main/manifests/dragonfly-operator.yaml
          kubectl -n dragonfly-operator-system rollout status deploy/dragonfly-operator --timeout 5m || true

      - name: Resolve chart dependencies
        run: helm dependency update charts/lan-software

      - name: Install lan-software
        run: |
          kubectl create namespace lan-software
          kubectl label namespace lan-software pod-security.kubernetes.io/enforce=baseline --overwrite
          helm install lan-software charts/lan-software \
            -n lan-software \
            -f examples/values-dev-kind.yaml \
            --wait --timeout 10m

      - name: Smoke test (per-app /up)
        run: |
          for app in lancore lanbrackets lanentrance lanshout lanhelp; do
            echo "== smoke $app =="
            kubectl -n lan-software run --rm -i curl-$app --image=curlimages/curl --restart=Never -- \
              curl -fsSL --max-time 10 http://lan-software-$app-web.lan-software.svc.cluster.local/up \
              || (echo "FAIL: $app"; exit 1)
          done

      - name: Dragonfly / Horizon parity smoke
        run: |
          # Dispatch a trivial queued job and confirm Horizon processes it against Dragonfly.
          LANCORE_POD=$(kubectl -n lan-software get pods -l app.kubernetes.io/name=lancore,lan-software.mawiguko.dev/component=web -o jsonpath='{.items[0].metadata.name}')
          kubectl -n lan-software exec "$LANCORE_POD" -- php artisan tinker --execute "dispatch(new \\App\\Jobs\\NoopJob);" || echo "NoopJob not present; skipping Horizon smoke"

      - name: Dump diagnostic info on failure
        if: failure()
        run: |
          kubectl -n lan-software get pods,svc,ingress,job,netpol
          kubectl -n lan-software describe pods
          kubectl -n lan-software logs -l app.kubernetes.io/part-of=lan-software --tail=200 --all-containers=true || true

      - name: Tear down
        if: always()
        run: kind delete cluster --name lan-software-smoke
