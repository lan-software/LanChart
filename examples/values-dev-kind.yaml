# Dev values for a local `kind` cluster. See `make kind-up && make install-dev`.
#
# - Single-replica everything.
# - TLS passthrough — kind has no ACME / no upstream proxy, so the chart emits
#   plain-HTTP Ingress objects (`global.tls.mode: passthrough`).
# - Shared Zalando Postgres CR with 1 instance.
# - Inline Dragonfly CR per sub-chart (cache.createInstance: true).
# - Stripe/WebPush/TMT2 disabled.
# - monitoring.enabled=false (kind clusters usually don't have prom-operator).
# - Hostnames flat: lancore.lan-software.local, lanbrackets.lan-software.local, …

global:
  domain: lan-software.local
  scheme: http                   # kind has no TLS in front of it
  lancoreHost: ""                # -> lancore.lan-software.local
  satelliteHostStyle: flat       # -> <slug>.lan-software.local
  tls:
    mode: passthrough            # ingress speaks plain HTTP; no cert-manager
    passthrough:
      trustedProxies: ["*"]
      forceSecureCookies: false  # dev only — public scheme is also http
  integrations:                  # auto-gen tokens via Helm lookup (stable across upgrades)
    lanbrackets: { host: "", token: "", announcementWebhookSecret: "", rolesWebhookSecret: "" }
    lanentrance: { host: "", token: "", announcementWebhookSecret: "", rolesWebhookSecret: "" }
    lanshout:    { host: "", token: "", announcementWebhookSecret: "", rolesWebhookSecret: "" }
    lanhelp:     { host: "", token: "", announcementWebhookSecret: "", rolesWebhookSecret: "" }
  database:
    provider: zalando
    zalando:
      teamId: lan
      clusterName: lan-postgres
      version: "16"
      instances: 1
      storage:
        size: 1Gi
        storageClass: standard
      backup:
        enabled: false
      databases:
        lancore:      lancore
        lanbrackets:  lanbrackets
        lanentrance:  lanentrance
        lanshout:     lanshout
        lanhelp:      lanhelp
  s3:
    mode: external
  podSecurity:
    profile: baseline
  monitoring:
    enabled: false
  otel:
    enabled: false

lancore:
  enabled: true
  web:
    replicaCount: 1
    hpa: { enabled: false }
    pdb: { enabled: false }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { memory: 768Mi }
  worker:
    replicaCount: 1
    pdb: { enabled: false }
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits:   { memory: 512Mi }
  ingress:
    enabled: true
    hosts: []                    # auto-derived (lancore.lan-software.local)
  cache:
    createInstance: true
    instance:
      name: lancore-dragonfly
      replicas: 1
      persistence: { enabled: false }
  storage:
    mode: external
  stripe:  { enabled: false }
  webpush: { enabled: false }
  tmt2:    { enabled: false }
  demo:    { enabled: true }
  pulse:   { enabled: true, authorize: admin-only }
  horizon: { enabled: true, authorize: admin-only }
  networkPolicy:
    enabled: false              # kind clusters often have no CNI enforcing NP

lanbrackets:
  enabled: true
  web:
    replicaCount: 1
    hpa: { enabled: false }
    pdb: { enabled: false }
  ingress:
    enabled: true
    hosts: []
  cache:    { createInstance: true }
  networkPolicy: { enabled: false }

lanentrance:
  enabled: true
  web:
    replicaCount: 1
    pdb: { enabled: false }
  ingress:
    enabled: true
    hosts: []
  cache:    { createInstance: true }
  networkPolicy: { enabled: false }

lanshout:
  enabled: true
  web:
    replicaCount: 1
    pdb: { enabled: false }
  ingress:
    enabled: true
    hosts: []
  cache:    { createInstance: true }
  networkPolicy: { enabled: false }

lanhelp:
  enabled: true
  web:
    replicaCount: 1
    pdb: { enabled: false }
  ingress:
    enabled: true
    hosts: []
  cache:    { createInstance: true }
  networkPolicy: { enabled: false }
